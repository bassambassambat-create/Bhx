<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox — 70 Handy Tools</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --text:#1a1d29; --muted:#666b7a;
  --accent:#4f46e5; --accent2:#7c3aed; --border:#e4e6ef; --danger:#e5484d;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --panel:#181b25; --text:#eceef5; --muted:#9aa0b4;
    --accent:#818cf8; --accent2:#a78bfa; --border:#2a2e3d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --panel:#181b25; --text:#eceef5; --muted:#9aa0b4;
  --accent:#818cf8; --accent2:#a78bfa; --border:#2a2e3d;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
header{padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--panel);}
header h1{font-size:1.15rem;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
button.themebtn{background:none;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:0.85rem;}
.wrap{display:flex;min-height:calc(100vh - 60px);align-items:flex-start;}
nav{width:250px;flex:none;border-right:1px solid var(--border);padding:12px;}
#navSearch{width:100%;padding:8px 10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.85rem;}
#navList{max-height:calc(100vh - 160px);overflow-y:auto;display:flex;flex-direction:column;}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;margin:2px 0;border-radius:8px;cursor:pointer;font-size:0.86rem;white-space:normal;}
nav button:hover{background:var(--border);}
nav button.active{background:var(--accent);color:#fff;}
main{flex:1;padding:22px;max-width:720px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;}
h2{margin-top:0;font-size:1.1rem;}
label{display:block;font-size:0.8rem;color:var(--muted);margin:10px 0 4px;}
input[type=text],input[type=number],textarea,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.9rem;font-family:inherit;}
textarea{resize:vertical;min-height:90px;}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:0.88rem;margin-top:10px;margin-right:6px;}
.btn.secondary{background:var(--border);color:var(--text);}
.btn.danger{background:var(--danger);}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>div{flex:1;min-width:120px;}
.result{margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);word-break:break-all;font-size:0.88rem;overflow-x:auto;}
.hint{font-size:0.78rem;color:var(--muted);margin-top:6px;}
ul.plainlist{list-style:none;padding:0;margin:10px 0;}
ul.plainlist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:0.9rem;}
.swatch{width:100%;height:60px;border-radius:8px;border:1px solid var(--border);margin-top:8px;}
@media(max-width:640px){.wrap{flex-direction:column;}nav{width:100%;border-right:none;border-bottom:1px solid var(--border);}#navList{max-height:260px;}main{max-width:100%;}}
</style>
</head>

let currentLang='en';
function applyLang(lang){
 currentLang=lang;
 document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
 const L=LANGS[lang];
 document.getElementById('appTitle').textContent=L.title;
 document.getElementById('themeLabel').textContent=L.theme;
 document.getElementById('navSearch').placeholder=L.search;
 const active=document.querySelector('nav button.active');
 if(active&&active.id==='nb_about')show('about',active);

}
function populateLangSelect(){
 const sel=document.getElementById('langSelect');
 Object.keys(LANGS).forEach(code=>{const o=document.createElement('option');o.value=code;o.textContent=LANGS[code].name;sel.appendChild(o);});
 sel.value='en';
}

// ---- Prayer Times ----
const PR_CITIES=[['Mecca, Saudi Arabia',21.4225,39.8262,'Asia/Riyadh'],['Medina, Saudi Arabia',24.4686,39.6142,'Asia/Riyadh'],['Cairo, Egypt',30.0444,31.2357,'Africa/Cairo'],['Istanbul, Turkey',41.0082,28.9784,'Europe/Istanbul'],['Lagos, Nigeria',6.5244,3.3792,'Africa/Lagos'],['Nairobi, Kenya',-1.2921,36.8219,'Africa/Nairobi'],['Johannesburg, South Africa',-26.2041,28.0473,'Africa/Johannesburg'],['London, UK',51.5074,-0.1278,'Europe/London'],['Paris, France',48.8566,2.3522,'Europe/Paris'],['Rome, Italy',41.9028,12.4964,'Europe/Rome'],['Moscow, Russia',55.7558,37.6173,'Europe/Moscow'],['Jerusalem, Israel',31.7683,35.2137,'Asia/Jerusalem'],['Dubai, UAE',25.2048,55.2708,'Asia/Dubai'],['Tehran, Iran',35.6892,51.389,'Asia/Tehran'],['Karachi, Pakistan',24.8607,67.0011,'Asia/Karachi'],['Delhi, India',28.6139,77.209,'Asia/Kolkata'],['Mumbai, India',19.076,72.8777,'Asia/Kolkata'],['Amritsar, India',31.634,74.8723,'Asia/Kolkata'],['Dhaka, Bangladesh',23.8103,90.4125,'Asia/Dhaka'],['Bangkok, Thailand',13.7563,100.5018,'Asia/Bangkok'],['Jakarta, Indonesia',-6.2088,106.8456,'Asia/Jakarta'],['Kuala Lumpur, Malaysia',3.139,101.6869,'Asia/Kuala_Lumpur'],['Singapore',1.3521,103.8198,'Asia/Singapore'],['Tokyo, Japan',35.6762,139.6503,'Asia/Tokyo'],['Sydney, Australia',-33.8688,151.2093,'Australia/Sydney'],['New York, USA',40.7128,-74.006,'America/New_York'],['Chicago, USA',41.8781,-87.6298,'America/Chicago'],['Los Angeles, USA',34.0522,-118.2437,'America/Los_Angeles'],['Toronto, Canada',43.6532,-79.3832,'America/Toronto'],['Mexico City, Mexico',19.4326,-99.1332,'America/Mexico_City'],['Sao Paulo, Brazil',-23.5505,-46.6333,'America/Sao_Paulo']];
const PR_METHODS={mwl:['Muslim World League',18,17],isna:['ISNA (North America)',15,15],egypt:['Egyptian Authority',19.5,17.5],karachi:['Univ. of Islamic Sciences, Karachi',18,18],umm:['Umm al-Qura (Makkah)',18.5,null]};
const PR_DEG=Math.PI/180;
let prLoc=null;
function prDeviceTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){return 'UTC';}}
function prCalc(y,m,d,lat,lng){
 const jd=Date.UTC(y,m-1,d)/864e5+2440587.5-lng/360,D=jd-2451545,g=((357.529+0.98560028*D)%360+360)%360,q=((280.459+0.98564736*D)%360+360)%360;
 const L=q+1.915*Math.sin(g*PR_DEG)+0.02*Math.sin(2*g*PR_DEG),e=23.439-3.6e-7*D;
 let RA=Math.atan2(Math.cos(e*PR_DEG)*Math.sin(L*PR_DEG),Math.cos(L*PR_DEG))/PR_DEG/15;RA=(RA%24+24)%24;
 const eqt=((q/15-RA+12)%24+24)%24-12,decl=Math.asin(Math.sin(e*PR_DEG)*Math.sin(L*PR_DEG))/PR_DEG,mid=((12-eqt)%24+24)%24;
 const tm=(a,ccw)=>{const x=(-Math.sin(a*PR_DEG)-Math.sin(decl*PR_DEG)*Math.sin(lat*PR_DEG))/(Math.cos(decl*PR_DEG)*Math.cos(lat*PR_DEG));if(x<-1||x>1)return NaN;const t=Math.acos(x)/PR_DEG/15;return mid+(ccw?-t:t);};
 const H=t=>isNaN(t)?null:new Date(Date.UTC(y,m-1,d)+(t-lng/15)*36e5);
 return {mid,decl,tm,H};
}
function prFmt(dt,tz){if(!dt)return '—';try{return new Intl.DateTimeFormat([],{hour:'2-digit',minute:'2-digit',timeZone:tz}).format(new Date(dt.getTime()+30000));}catch(e){return '—';}}
function prQibla(lat,lng){const k=21.4225*PR_DEG,p=lat*PR_DEG,dl=39.8262*PR_DEG-lng*PR_DEG;return ((Math.atan2(Math.sin(dl),Math.cos(p)*Math.tan(k)-Math.sin(p)*Math.cos(dl))/PR_DEG)+360)%360;}
function prRows(rel,c,lat,lng){
 const {mid,decl,tm,H}=c,sr=tm(0.833,true),ss=tm(0.833,false),hrs=[],mn=60/60;
 if(isNaN(sr)||isNaN(ss))return {rows:[],note:'The sun does not rise or set on this date at this latitude, so times cannot be calculated.'};
 const th=(ss-sr)/12,at=h=>H(sr+h*th),R=(n,a,d,b)=>({n,a,d,b});
 if(rel==='islam'){
  const o=PR_METHODS[document.getElementById('prMethod').value],f=+document.getElementById('prAsr').value;
  const night=sr+24-ss;let fa=tm(o[1],true),is=o[2]===null?ss+1.5:tm(o[2],false);
  if(isNaN(fa))fa=sr-night*(o[1]/60);if(isNaN(is))is=ss+night*((o[2]||17)/60);
  const as=tm(-Math.atan(1/(f+Math.tan(Math.abs(lat-decl)*PR_DEG)))/PR_DEG,false);
  return {rows:[R('Fajr',H(fa),'Dawn prayer'),R('Sunrise',H(sr),'End of Fajr time'),R('Dhuhr',H(mid+1/60),'Midday prayer'),R('Asr',H(as),'Afternoon prayer'),R('Maghrib',H(ss),'Sunset prayer'),R('Isha',H(is),'Night prayer')],note:'Qibla (direction to the Kaaba): '+Math.round(prQibla(lat,lng))+'° clockwise from true north. Calculated with the '+o[0]+' method; check your local mosque for exact times.'};
 }
 if(rel==='christian')return {rows:[R('Lauds',H(tm(6,true)),'Morning Prayer, at first light'),R('Prime',H(sr),'First hour, at sunrise'),R('Terce',at(3),'Third hour (mid-morning)'),R('Sext',H(mid),'Sixth hour (midday)'),R('None',at(9),'Ninth hour (mid-afternoon)'),R('Vespers',H(ss),'Evening Prayer, at sunset'),R('Compline',H(ss+3),'Night Prayer, before bed')],note:'Traditional canonical hours (Liturgy of the Hours). Denominations and parishes vary, and Sunday services follow your church schedule.'};
 if(rel==='jewish')return {rows:[R('Alot HaShachar',H(tm(16.1,true)),'Dawn, earliest time for morning prayers'),R('Netz (sunrise)',H(sr),'Ideal start of Shacharit'),R('Latest Shema',at(3),'End of the morning Shema time (GRA)'),R('Latest Shacharit',at(4),'End of morning prayer time'),R('Chatzot',H(mid),'Halachic midday'),R('Mincha Gedola',at(6.5),'Earliest afternoon prayer'),R('Mincha Ketana',at(9.5),'Preferred afternoon prayer'),R('Plag HaMincha',at(10.75),'Earliest Maariv for some'),R('Shkiah (sunset)',H(ss),'Sunset'),R('Tzeit HaKochavim',H(tm(8.5,false)),'Nightfall, Maariv time')],note:'Zmanim using the GRA method. Practice differs between communities, so follow your rabbi or local luach for exact times.'};
 if(rel==='hindu')return {rows:[R('Brahma Muhurta',H(sr-1.6),'Auspicious pre-dawn time for meditation',H(sr-0.8)),R('Pratah Sandhya',H(sr),'Morning prayers and Gayatri japa at sunrise'),R('Madhyahna Sandhya',H(mid),'Midday prayers'),R('Abhijit Muhurta',H(mid-0.4),'Auspicious midday window',H(mid+0.4)),R('Sayam Sandhya',H(ss),'Evening prayers at sunset')],note:'Approximate times based on sunrise, midday and sunset. Your local panchang may differ.'};
 if(rel==='sikh')return {rows:[R('Amrit Vela',H(sr-3),'Ambrosial hours: Japji Sahib and morning Nitnem',H(sr)),R('Rehras Sahib',H(ss),'Evening prayer at sunset'),R('Kirtan Sohila',H(ss+3),'Night prayer before sleeping (approx.)')],note:'Traditional guidance. Amrit Vela is commonly the last part of the night before sunrise; many gurdwaras keep their own schedule.'};
 return {rows:[R('Morning practice',H(tm(6,true)),'Chanting or meditation at first light',H(sr+1)),R('Midday pause',H(mid),'Optional mindful pause or offering'),R('Evening practice',H(ss),'Chanting or meditation at sunset',H(ss+1))],note:'Buddhism has no fixed daily prayer times. These are common times for morning and evening chanting or meditation; traditions differ.'};
}
function prSetLoc(v){
 const box=document.getElementById('prCustom'),msg=document.getElementById('prMsg');box.style.display='none';msg.textContent='';
 if(v==='custom'){box.style.display='block';prLoc=null;}
 else if(v==='gps'){msg.textContent='Finding your location…';if(!navigator.geolocation){msg.textContent='Location is not available here. Choose a city or enter coordinates.';return;}
  navigator.geolocation.getCurrentPosition(p=>{prLoc={lat:p.coords.latitude,lng:p.coords.longitude,tz:prDeviceTz(),label:'Your location'};msg.textContent='';prRender();},()=>{msg.textContent='Could not get your location. Choose a city or enter coordinates.';},{timeout:10000});return;}
 else if(v!==''){const c=PR_CITIES[+v];prLoc={lat:c[1],lng:c[2],tz:c[3],label:c[0]};}
 prRender();
}
function prCustomChange(){const la=parseFloat(document.getElementById('prLat').value),ln=parseFloat(document.getElementById('prLng').value);prLoc=(la>=-90&&la<=90&&ln>=-180&&ln<=180)?{lat:la,lng:ln,tz:prDeviceTz(),label:'Custom location'}:null;prRender();}
function prRender(){

function genPw(){const len=+document.getElementById('pwLen').value;const sym=document.getElementById('pwSym').checked;const num=document.getElementById('pwNum').checked;
let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';if(num)chars+='0123456789';if(sym)chars+='!@#$%^&*()_+-=[]{}';
let out='';const arr=new Uint32Array(len);crypto.getRandomValues(arr);for(let i=0;i<len;i++)out+=chars[arr[i]%chars.length];
document.getElementById('pwOut').textContent=out;}
function b64(mode){const v=document.getElementById('b64In').value;try{document.getElementById('b64Out').textContent=mode==='e'?btoa(unescape(encodeURIComponent(v))):decodeURIComponent(escape(atob(v)));}catch(e){document.getElementById('b64Out').textContent='Error: invalid input';}}
function urlEnc(mode){const v=document.getElementById('urlIn').value;try{document.getElementById('urlOut').textContent=mode==='e'?encodeURIComponent(v):decodeURIComponent(v);}catch(e){document.getElementById('urlOut').textContent='Error: invalid input';}}

function tc(mode){let v=document.getElementById('tcIn').value;let out=v;
if(mode==='upper')out=v.toUpperCase();else if(mode==='lower')out=v.toLowerCase();
else if(mode==='title')out=v.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
else if(mode==='sentence')out=v.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase());
document.getElementById('tcOut').textContent=out;}
async function doHash(){const v=document.getElementById('hIn').value;const enc=new TextEncoder().encode(v);const buf=await crypto.subtle.digest('SHA-256',enc);const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('hOut').textContent=hex;}

const ucUnits={length:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.34,yd:0.9144,ft:0.3048,in:0.0254},weight:{kg:1,g:0.001,mg:0.000001,lb:0.453592,oz:0.0283495,ton:1000}};
function ucBuild(){const cat=document.getElementById('ucCat').value;const from=document.getElementById('ucFrom'),to=document.getElementById('ucTo');from.innerHTML='';to.innerHTML='';
if(cat==='temp'){['C','F','K'].forEach(u=>{from.innerHTML+=`<option>${u}</option>`;to.innerHTML+=`<option>${u}</option>`;});to.selectedIndex=1;}
else{Object.keys(ucUnits[cat]).forEach(u=>{from.innerHTML+=`<option>${u}</option>`;to.innerHTML+=`<option>${u}</option>`;});to.selectedIndex=1;}

function ucCalc(){const cat=document.getElementById('ucCat').value;const val=+document.getElementById('ucVal').value;const from=document.getElementById('ucFrom').value,to=document.getElementById('ucTo').value;let out;
if(cat==='temp'){let c;if(from==='C')c=val;else if(from==='F')c=(val-32)*5/9;else c=val-273.15;
if(to==='C')out=c;else if(to==='F')out=c*9/5+32;else out=c+273.15;}
else{out=val*ucUnits[cat][from]/ucUnits[cat][to];}
document.getElementById('ucOut').textContent=`${val} ${from} = ${(+out.toFixed(6))} ${to}`;}

const wrtc={pc:null,dc:null,file:null,
async startSend(){
 const area=document.getElementById('wrtcArea');
 area.innerHTML=`<label>Select file to send</label><input type="file" id="fSel"><div id="wStatus" class="hint">Preparing...</div><div id="wSignal"></div>`;
 this.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 this.dc=this.pc.createDataChannel('file');
 this.dc.binaryType='arraybuffer';
 this.dc.onopen=()=>{document.getElementById('wStatus').textContent='Connected! Sending file...';this.sendFile();};
 const offer=await this.pc.createOffer();await this.pc.setLocalDescription(offer);
 await new Promise(res=>{if(this.pc.iceGatheringState==='complete')res();else this.pc.onicegatheringstatechange=()=>{if(this.pc.iceGatheringState==='complete')res();};});
 const code=btoa(JSON.stringify(this.pc.localDescription));
 document.getElementById('wSignal').innerHTML=`<label>Step 1: Copy this code, send it to the other device</label><textarea readonly onclick="this.select()">${code}</textarea>
 <label>Step 2: Paste the answer code from the other device here</label><textarea id="wAnswer"></textarea>
 <button class="btn" onclick="wrtc.completeSend()">Connect</button>`;
 document.getElementById('fSel').onchange=e=>{this.file=e.target.files[0];};
},
async completeSend(){
 const ans=document.getElementById('wAnswer').value.trim();
 try{const desc=JSON.parse(atob(ans));await this.pc.setRemoteDescription(desc);document.getElementById('wStatus').textContent='Connecting...';}
 catch(e){document.getElementById('wStatus').textContent='Invalid code.';}
},
sendFile(){
 if(!this.file){document.getElementById('wStatus').textContent='No file selected.';return;}
 const CHUNK=16384;const reader=new FileReader();let offset=0;
 this.dc.send(JSON.stringify({name:this.file.name,size:this.file.size,type:this.file.type}));
 const readSlice=o=>{const slice=this.file.slice(o,o+CHUNK);reader.readAsArrayBuffer(slice);};
 reader.onload=e=>{this.dc.send(e.target.result);offset+=e.target.result.byteLength;
  document.getElementById('wStatus').textContent=`Sending... ${Math.min(100,Math.floor(offset/this.file.size*100))}%`;
  if(offset<this.file.size)readSlice(offset);else document.getElementById('wStatus').textContent='✅ File sent!';};
 readSlice(0);
},
async startReceive(){
 const area=document.getElementById('wrtcArea');
 area.innerHTML=`<label>Step 1: Paste the code from the sending device</label><textarea id="wOffer"></textarea>
 <button class="btn" onclick="wrtc.completeReceive()">Generate Answer</button>
 <div id="wStatus" class="hint"></div><div id="wSignal2"></div>`;
 this.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 this.received=[];this.meta=null;this.recvBytes=0;
 this.pc.ondatachannel=e=>{this.dc=e.channel;this.dc.binaryType='arraybuffer';
  this.dc.onmessage=ev=>{
   if(typeof ev.data==='string'){this.meta=JSON.parse(ev.data);this.received=[];this.recvBytes=0;document.getElementById('wStatus').textContent='Receiving '+this.meta.name+'...';}

// Tic-Tac-Toe
const TT={b:[],over:false};
function ttWin(b){for(const [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.includes('')?null:'draw';}
function ttMM(b,p){const w=ttWin(b);if(w)return {s:w==='O'?1:w==='X'?-1:0};let best=null;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=ttMM(b,p==='O'?'X':'O').s;b[i]='';if(best===null||(p==='O'?s>best.s:s<best.s))best={s,i};}return best;}
function ttDraw(m){gm('ttGrid').innerHTML=TT.b.map((v,i)=>'<button style="'+GS+'" onclick="ttClick('+i+')">'+v+'</button>').join('');gm('ttMsg').textContent=m;}
function ttInit(){TT.b=Array(9).fill('');TT.over=false;ttDraw('You are X. Your move!');}
function ttClick(i){if(TT.b[i]||TT.over)return;TT.b[i]='X';let w=ttWin(TT.b);if(!w){const e=TT.b.map((v,k)=>v?-1:k).filter(k=>k>=0),m=Math.random()<0.25?e[Math.floor(Math.random()*e.length)]:ttMM(TT.b.slice(),'O').i;TT.b[m]='O';w=ttWin(TT.b);}TT.over=!!w;ttDraw(w==='X'?'You win! 🎉':w==='O'?'Computer wins 🤖':w==='draw'?"It's a draw 🤝":'Your move!');}

GAMES.forEach((g,i)=>{tools.splice(2+i,0,[g.id,g.icon+' '+g.title]);renderers[g.id]=()=>'<h2>'+g.icon+' '+g.title+'</h2><p class="hint">'+g.hint+'</p>'+g.html;after[g.id]=g.init;});
function renderGeneric(t){
 const desc=t.desc?`<p class="hint">${t.desc}</p>`:'';
 const L=LANGS[currentLang];
 if(t.type==='text')return `<h2>${t.icon} ${t.title}</h2>${desc}<textarea id="genIn" placeholder="Enter input..."></textarea><button class="btn" onclick="runGeneric('${t.id}')" data-notr>${L.run}</button><div class="result" id="genOut" style="white-space:pre-wrap">—</div>`;
 if(t.type==='gen')return `<h2>${t.icon} ${t.title}</h2>${desc}<button class="btn" onclick="runGeneric('${t.id}')" data-notr>${L.gen}</button><div class="result" id="genOut" style="white-space:pre-wrap">—</div>`;
 if(t.type==='form'){
  let html=`<h2>${t.icon} ${t.title}</h2>${desc}<div class="row">`;
  t.fields.forEach(f=>{html+=`<div><label>${f.label}</label><input type="${f.type||'text'}" id="gf_${f.id}" value="${f.default!==undefined?f.default:''}"></div>`;});
  html+=`</div><button class="btn" onclick="runGeneric('${t.id}')" data-notr>${L.calc}</button><div class="result" id="genOut" style="white-space:pre-wrap">—</div>`;
  return html;
 }
}
function runGeneric(id){
 const t=genericTools.find(x=>x.id===id);
 try{
  let out;
  if(t.type==='text')out=t.fn(document.getElementById('genIn').value);
  else if(t.type==='gen')out=t.fn();
  else{const vals={};t.fields.forEach(f=>vals[f.id]=document.getElementById('gf_'+f.id).value);out=t.fn(vals);}
  document.getElementById('genOut').textContent=out;
 }catch(e){document.getElementById('genOut').textContent='Error: '+e.message;}
}

// ================= NAV =================
const navList=document.getElementById('navList');
tools.forEach(([id,label])=>{
 const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(id,b);b.id='nb_'+id;b.dataset.label=label.toLowerCase();navList.appendChild(b);
});
function filterNav(){
 const q=document.getElementById('navSearch').value.toLowerCase();
 document.querySelectorAll('#navList button').forEach(b=>{b.style.display=(b.dataset.label.includes(q)||b.textContent.toLowerCase().includes(q))?'block':'none';});
}
function show(id,btn){
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 (btn||document.getElementById('nb_'+id)).classList.add('active');
 document.getElementById('content').innerHTML=renderers[id]();
 if(after[id])after[id]();
}
// ---- Full-page translation (on-device Translator API, or Claude for signed-in viewers) ----
const TR={src:new Map(),cache:{},run:0};
const TR_NAMES={es:'Spanish',fr:'French',de:'German',it:'Italian',pt:'Portuguese',ru:'Russian',ar:'Arabic',zh:'Simplified Chinese',ja:'Japanese',ko:'Korean',hi:'Hindi',tr:'Turkish',id:'Indonesian',nl:'Dutch',sw:'Swahili'};
function trCache(l){if(!TR.cache[l]){try{TR.cache[l]=JSON.parse(localStorage.getItem('tr_'+l)||'{}');}catch(e){TR.cache[l]={};}}return TR.cache[l];}
function trStatus(t){const e=document.getElementById('trStatus');if(e)e.textContent=t;}
function trCollect(){
 const items=[];
 document.querySelectorAll('#navList button,#content').forEach(root=>{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
   const p=n.parentElement;if(!p||p.closest('[data-notr],.result,pre,textarea,script,style,code'))continue;
   const r=TR.src.get(n),full=r&&r.tr===n.nodeValue?r.en:n.nodeValue;
   if(!/[A-Za-z]{2}/.test(full)||/^[\s\d:.,–\-]*(AM|PM)?[\s\d:.,–\-]*$/.test(full))continue;
   items.push({node:n,full,core:full.trim()});
  }
 });
 document.querySelectorAll('#content [placeholder]').forEach(el=>{if(!el.dataset.enPh)el.dataset.enPh=el.placeholder;if(/[A-Za-z]{2}/.test(el.dataset.enPh))items.push({el,core:el.dataset.enPh});});
 return items;
}
async function trTranslate(list,lang){
 const res={};
 try{if(self.Translator){const a=await Translator.availability({sourceLanguage:'en',targetLanguage:lang});if(a!=='unavailable'){const t=await Translator.create({sourceLanguage:'en',targetLanguage:lang});for(const s of list){try{res[s]=await t.translate(s);}catch(e){}}if(Object.keys(res).length)return res;}}}catch(e){}
 try{if(window.claude&&claude.use){const sm=await claude.use('sample');if(sm){for(let i=0;i<list.length;i+=70){const ch=list.slice(i,i+70);const a=await sm.json('Translate each string in this JSON array from English to '+TR_NAMES[lang]+'. Keep emoji, numbers and punctuation unchanged. Return ONLY a JSON array of translated strings with the same length and order.\n'+JSON.stringify(ch),{modelTier:'quick'});if(Array.isArray(a)&&a.length===ch.length)ch.forEach((s,k)=>res[s]=String(a[k]));}}}}catch(e){}
 return res;
}
async function trApply(){
 const lang=currentLang,my=++TR.run;
 if(lang==='en'){TR.src.forEach((r,n)=>{if(n.isConnected)n.nodeValue=r.en;});TR.src.clear();document.querySelectorAll('[data-en-ph]').forEach(e=>{e.placeholder=e.dataset.enPh;});trStatus('');return;}
 const items=trCollect(),cache=trCache(lang),need=[...new Set(items.map(i=>i.core).filter(s=>!(s in cache)))];
 if(need.length){
  trStatus('⏳ Translating…');
  const got=await trTranslate(need,lang);if(my!==TR.run)return;
  Object.assign(cache,got);try{localStorage.setItem('tr_'+lang,JSON.stringify(cache));}catch(e){}
  trStatus(Object.keys(got).length?'':'Full-page translation needs Chrome or Edge on desktop (free, built-in). Menu, title and About are still translated.');
 }
 items.forEach(i=>{const t=cache[i.core];if(!t)return;
  if(i.el){i.el.placeholder=t;return;}
  const out=i.full.replace(i.core,t);TR.src.set(i.node,{en:i.full,tr:out});i.node.nodeValue=out;});
}
let trTimer;new MutationObserver(()=>{if(currentLang==='en')return;clearTimeout(trTimer);trTimer=setTimeout(trApply,250);}).observe(document.getElementById('content'),{childList:true,subtree:true});

populateLangSelect();
show('about');
</script>
